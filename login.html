<!-- Student login page. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Python Boot Camp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="back-link" href="index.html">← Back to home</a>
    <section class="auth-card">
      <div class="auth-logo"><img src="logo_final.jpeg" alt="College Logo"></div>
      <span class="eyebrow">STUDENT PORTAL</span>
      <h1>Welcome back</h1>
      <p class="muted">Login to access your Boot Camp dashboard.</p>
      <form id="loginForm">
        <label>Email<input type="email" id="email" required autocomplete="email"></label>
        <label>Password<input type="password" id="password" required autocomplete="current-password"></label>
        <button class="btn primary full" type="submit">Login</button>
        <div id="status" class="status"></div>
        <p class="switch"><a href="student-forgot.html">Forgot Password?</a></p>
      </form>
      <p class="switch">New student? <a href="register.html">Create account</a></p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
